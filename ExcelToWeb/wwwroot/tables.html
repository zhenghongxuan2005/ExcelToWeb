<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表格管理 - Excel 在线编辑工具</title>
    <script>
        // 尽早应用主题，避免闪烁
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 页面外壳：图标 sprite / 主题切换 / 退出登录 / 导航高亮，由 js/shell.js 统一提供 -->
    <script src="js/shell.js"></script>
    <a class="skip-link" href="#mainContent">跳到主要内容</a>

    <div class="app-shell">
        <!-- ===== 侧边栏 ===== -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><svg class="icon"><use href="#i-table"/></svg></div>
                <span class="brand-name">ExcelToWeb</span>
            </div>

            <nav class="sidebar-nav">
                <a class="nav-link" href="/" data-page="index" data-label="表格编辑"><svg class="icon"><use href="#i-table"/></svg><span class="collapse-hide">表格编辑</span></a>
                <a class="nav-link" href="/tables.html" data-page="tables" data-label="表格管理"><svg class="icon"><use href="#i-columns"/></svg><span class="collapse-hide">表格管理</span></a>
                <a class="nav-link" href="/dashboard.html" data-page="dashboard" data-label="数据看板"><svg class="icon"><use href="#i-chart"/></svg><span class="collapse-hide">数据看板</span></a>
                <a class="nav-link" href="/help.html" data-page="help" data-label="使用帮助"><svg class="icon"><use href="#i-help"/></svg><span class="collapse-hide">使用帮助</span></a>
                <a class="nav-link" href="/settings.html" data-page="settings" data-label="设置"><svg class="icon"><use href="#i-settings"/></svg><span class="collapse-hide">设置</span></a>
            </nav>

            <div class="sidebar-bottom">
                <button class="btn btn-outline btn-sm sidebar-collapse-btn" id="sidebarToggle"
                        aria-label="折叠侧边栏" title="折叠侧边栏" aria-expanded="true">
                    <svg class="icon"><use href="#i-chevron-left"/></svg><span class="collapse-label collapse-hide">折叠侧边栏</span>
                </button>
                <button class="btn btn-outline btn-sm" id="themeToggle" aria-label="切换主题">
                    <svg class="icon"><use href="#i-moon"/></svg><span class="theme-label collapse-hide">深色模式</span>
                </button>
                <div class="user-box">
                    <svg class="icon icon-sm"><use href="#i-user"/></svg>
                    <span id="userInfo"></span>
                </div>
                <button class="btn btn-outline btn-sm" onclick="handleLogout()">
                    <svg class="icon"><use href="#i-logout"/></svg><span class="collapse-hide">退出登录</span>
                </button>
            </div>
        </aside>

        <!-- ===== 主内容 ===== -->
        <main class="main" id="mainContent">
            <div class="page-header">
                <h1><svg class="icon"><use href="#i-columns"/></svg>表格管理</h1>
                <div class="header-tools">
                    <span class="status-pill" id="tableCount"></span>
                    <button class="btn btn-outline btn-sm" onclick="loadManageList()">
                        <svg class="icon icon-sm"><use href="#i-refresh"/></svg>刷新
                    </button>
                    <a class="btn btn-primary btn-sm" href="/">
                        <svg class="icon icon-sm"><use href="#i-upload"/></svg>导入新表格
                    </a>
                </div>
            </div>

            <p class="page-desc">集中管理已导入的表格：打开编辑、重命名、复制、导出或删除。</p>

            <div id="tableGrid" class="table-grid">
                <div class="empty-state"><p>加载中...</p></div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/palette.js"></script>
    <script src="js/tables-page.js"></script>
</body>
</html>
