<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Excel 在线编辑工具</title>
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ===== SVG 图标库 ===== -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></symbol>
        <symbol id="i-windows" viewBox="0 0 24 24"><path d="M3 5.5 10.5 4.4v7.1H3zM11.5 4.2 21 3v8.5h-9.5zM3 12.5h7.5v7.1L3 18.5zM11.5 12.5H21V21l-9.5-1.3z"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
        <!-- 语言切换（见 js/i18n.js 的 mountSwitcher） -->
        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
    </svg>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-brand">
                <div class="brand-icon"><svg class="icon" style="width:20px;height:20px;"><use href="#i-table"/></svg></div>
                <span class="brand-name">ExcelToWeb</span>
            </div>
            <h1 class="auth-title" id="pageTitle">欢迎回来</h1>
            <p class="auth-sub" id="pageSub">登录后继续管理你的数据</p>

            <div id="windowsStatus" class="auth-status hidden">
                正在使用 Windows 账号自动登录...
            </div>

            <div id="loginForm" class="hidden">
                <div class="field">
                    <label class="field-label">用户名</label>
                    <input type="text" id="loginUsername" class="input" placeholder="请输入用户名" autocomplete="username">
                </div>
                <div class="field">
                    <label class="field-label">密码</label>
                    <input type="password" id="loginPassword" class="input" placeholder="请输入密码" autocomplete="current-password">
                    <div class="error-msg" id="loginError"></div>
                </div>
                <button class="btn btn-primary" style="width:100%; padding:12px; font-size:15px;" onclick="handleLogin()">登 录</button>
                <div class="auth-divider">或</div>
                <button class="btn btn-outline" style="width:100%; padding:11px;" onclick="tryWindowsLogin(true)">
                    <svg class="icon"><use href="#i-windows"/></svg>使用 Windows 账号登录
                </button>
                <button class="btn btn-outline" style="width:100%; padding:11px; margin-top:10px;" onclick="tryDemoLogin()">
                    <svg class="icon"><use href="#i-user"/></svg>一键体验演示账号（只读）
                </button>
                <div class="auth-alt">还没有账号？<a href="#" onclick="showRegister()">立即注册</a></div>
            </div>

            <div id="registerForm" class="hidden">
                <div class="field">
                    <label class="field-label">用户名（3-20位，仅字母和数字）</label>
                    <input type="text" id="registerUsername" class="input" placeholder="请输入用户名">
                </div>
                <div class="field">
                    <label class="field-label">密码（至少6位）</label>
                    <input type="password" id="registerPassword" class="input" placeholder="请输入密码">
                </div>
                <div class="field">
                    <label class="field-label">确认密码</label>
                    <input type="password" id="registerConfirmPassword" class="input" placeholder="请再次输入密码">
                    <div class="error-msg" id="registerError"></div>
                </div>
                <button class="btn btn-primary" style="width:100%; padding:12px; font-size:15px;" onclick="handleRegister()">注 册</button>
                <div class="auth-alt">已有账号？<a href="#" onclick="showLogin()">去登录</a></div>
            </div>

            <!-- 语言切换：i18n.js 会在这里生成「地球图标 + 中 / EN」分段控件 -->
            <div class="auth-lang" data-lang-mount></div>
        </div>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/i18n-en.js"></script>
    <script>
        // 文案统一走字典，漏翻时回落中文；i18n.js 未加载时也不至于报错
        function tr(key) {
            return typeof I18n !== 'undefined' ? I18n.t(key) : key;
        }

        function showRegister() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('registerForm').classList.remove('hidden');
            document.getElementById('pageTitle').textContent = tr('创建账号');
            document.getElementById('pageSub').textContent = tr('注册后即可开始使用');
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
        }

        function showLogin() {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('pageTitle').textContent = tr('欢迎回来');
            document.getElementById('pageSub').textContent = tr('登录后继续管理你的数据');
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
        }

        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + (type || 'success');
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorEl = document.getElementById('loginError');

            if (!username || !password) {
                errorEl.textContent = tr('请填写完整信息');
                return;
            }
            errorEl.textContent = '';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await res.json();
                if (result.success && result.data) {
                    localStorage.setItem('token', result.data.token);
                    localStorage.setItem('refreshToken', result.data.refreshToken || '');
                    localStorage.setItem('familyId', result.data.familyId || '');
                    localStorage.setItem('username', result.data.username);
                    showToast(tr('登录成功，跳转中...'), 'success');
                    setTimeout(() => { window.location.href = '/'; }, 800);
                } else {
                    errorEl.textContent = result.message || tr('登录失败');
                }
            } catch (err) {
                errorEl.textContent = tr('网络错误，请稍后重试');
                console.error(err);
            }
        }

        async function handleRegister() {
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('registerConfirmPassword').value;
            const errorEl = document.getElementById('registerError');

            if (!username || !password || !confirmPassword) {
                errorEl.textContent = tr('请填写完整信息');
                return;
            }
            if (password !== confirmPassword) {
                errorEl.textContent = tr('两次密码输入不一致');
                return;
            }
            errorEl.textContent = '';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, confirmPassword })
                });
                const result = await res.json();
                if (result.success) {
                    showToast(tr('注册成功，请登录'), 'success');
                    showLogin();
                    document.getElementById('loginUsername').value = username;
                } else {
                    errorEl.textContent = result.message || tr('注册失败');
                }
            } catch (err) {
                errorEl.textContent = tr('网络错误，请稍后重试');
                console.error(err);
            }
        }

        // 演示账号一键进入：服务端对 demo 用户拦截全部写操作，只能浏览、筛选与导出。
        // 账号密码公开在页面上是产品设计（给 recruiter 30 秒内看到完整功能），不是泄露。
        async function tryDemoLogin() {
            const errorEl = document.getElementById('loginError');
            errorEl.textContent = '';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'demo', password: 'demo1234' })
                });
                const result = await res.json();
                if (result.success && result.data) {
                    localStorage.setItem('token', result.data.token);
                    localStorage.setItem('refreshToken', result.data.refreshToken || '');
                    localStorage.setItem('familyId', result.data.familyId || '');
                    localStorage.setItem('username', result.data.username);
                    showToast(tr('正在进入演示模式...'), 'success');
                    setTimeout(() => { window.location.href = '/'; }, 800);
                } else {
                    errorEl.textContent = result.message || tr('演示账号暂不可用');
                }
            } catch (err) {
                errorEl.textContent = tr('网络错误，请稍后重试');
                console.error(err);
            }
        }

        // 尝试 Windows 集成身份验证（浏览器自动协商，无需输入账号密码）
        async function tryWindowsLogin(manual) {
            // 手动点击按钮时先征求用户同意，不悄悄登录
            if (manual && !confirm(tr('确定使用当前 Windows 账号登录吗？'))) return;

            const statusEl = document.getElementById('windowsStatus');
            statusEl.classList.remove('hidden');
            document.getElementById('loginForm').classList.add('hidden');

            let success = false;
            try {
                const res = await fetch('/api/auth/windows', { credentials: 'include' });
                if (res.ok) {
                    const result = await res.json();
                    if (result.success && result.data) {
                        localStorage.setItem('token', result.data.token);
                        localStorage.setItem('refreshToken', result.data.refreshToken || '');
                        localStorage.setItem('familyId', result.data.familyId || '');
                        localStorage.setItem('username', result.data.username);
                        window.location.href = '/';
                        success = true;
                        return;
                    }
                }
            } catch (err) {
                console.error('Windows 登录失败:', err);
            }

            // 失败则回退到账号密码表单
            statusEl.classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            if (manual && !success) showToast(tr('Windows 登录不可用或已被拒绝，请使用账号密码登录'), 'error');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                if (!document.getElementById('loginForm').classList.contains('hidden')) {
                    handleLogin();
                } else {
                    handleRegister();
                }
            }
        });

        // 页面加载：已有有效 token 直接进主页；否则尝试 Windows 静默登录，失败回退到表单。
        // 例外：URL 带 loggedout=1（用户刚点了退出登录）时跳过一切自动登录，
        // 否则 Windows 集成认证会静默把用户重新登回去，表现为“退出登录没反应”。
        (async function initLoginPage() {
            // 刚退出登录：跳过一切自动登录，直接显示账号密码表单
            if (new URLSearchParams(window.location.search).has('loggedout')) {
                document.getElementById('loginForm').classList.remove('hidden');
                return;
            }
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const res = await fetch('/api/auth/me', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    const result = await res.json();
                    if (result.success) {
                        window.location.href = '/';
                        return;
                    }
                } catch (err) { /* 忽略，继续走登录流程 */ }
                localStorage.removeItem('token');
                localStorage.removeItem('refreshToken');
                localStorage.removeItem('username');
            }
            await tryWindowsLogin(false);
        })();
    </script>
</body>
</html>
