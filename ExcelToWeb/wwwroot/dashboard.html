<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售条线视图</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        .dashboard-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

            .dashboard-header h1 {
                font-size: 24px;
                font-weight: 700;
                color: #0b1e33;
            }

            .dashboard-header a {
                color: #1a5cff;
                text-decoration: none;
                font-size: 14px;
            }

                .dashboard-header a:hover {
                    text-decoration: underline;
                }
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: #f8faff;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #eaf0f8;
        }

            .stat-card .label {
                font-size: 13px;
                color: #6b7b93;
            }

            .stat-card .value {
                font-size: 28px;
                font-weight: 700;
                color: #0b1e33;
                margin-top: 4px;
            }
        /* 控制栏 */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px 20px;
            background: #f8faff;
            border-radius: 12px;
            border: 1px solid #eaf0f8;
            align-items: center;
        }

            .controls label {
                font-size: 13px;
                color: #4a5a72;
                font-weight: 500;
            }

            .controls select {
                padding: 6px 12px;
                border: 1px solid #dce3ed;
                border-radius: 6px;
                font-size: 13px;
                background: white;
            }
        /* 图表容器 */
        #chartContainer {
            width: 100%;
            height: 400px;
            background: white;
            border-radius: 12px;
            border: 1px solid #eaf0f8;
            padding: 16px;
            margin-bottom: 24px;
        }
        /* 汇总表格 */
        .summary-table-wrap {
            background: white;
            border-radius: 12px;
            border: 1px solid #eaf0f8;
            overflow: hidden;
        }

            .summary-table-wrap table {
                width: 100%;
                border-collapse: collapse;
                font-size: 14px;
            }

            .summary-table-wrap th {
                background: #f8faff;
                text-align: left;
                padding: 12px 16px;
                font-weight: 600;
                color: #4a5a72;
                border-bottom: 2px solid #e2e8f0;
            }

            .summary-table-wrap td {
                padding: 10px 16px;
                border-bottom: 1px solid #f0f4fa;
            }

            .summary-table-wrap tr:hover td {
                background: #fafcff;
            }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: #9aabbf;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>📊 销售条线视图</h1>
            <a href="/">← 返回表格编辑</a>
        </div>

        <div id="dashboardContent">
            <div class="empty-state">
                <div class="empty-icon">📂</div>
                <p>请先在表格页面上传 Excel 数据</p>
                <p style="font-size:13px; color:#9aabbf;">上传后刷新此页面即可看到看板</p>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
