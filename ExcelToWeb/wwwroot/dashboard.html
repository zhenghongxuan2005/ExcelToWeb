<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据看板 - Excel 在线编辑工具</title>
    <script>
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>
    <!-- ===== SVG 图标库 ===== -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></symbol>
        <symbol id="i-chart" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
        <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
        <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
    </svg>

    <div class="app-shell">
        <!-- ===== 侧边栏 ===== -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><svg class="icon"><use href="#i-table"/></svg></div>
                <span class="brand-name">ExcelToWeb</span>
            </div>

            <nav class="sidebar-nav">
                <a class="nav-link" href="/"><svg class="icon"><use href="#i-table"/></svg>表格编辑</a>
                <a class="nav-link active" href="/dashboard.html"><svg class="icon"><use href="#i-chart"/></svg>数据看板</a>
            </nav>

            <div class="sidebar-bottom">
                <button class="btn btn-outline btn-sm" id="themeToggle">
                    <svg class="icon"><use href="#i-moon"/></svg><span class="theme-label">深色模式</span>
                </button>
                <div class="user-box">
                    <svg class="icon icon-sm"><use href="#i-user"/></svg>
                    <span id="userInfo"></span>
                </div>
                <button class="btn btn-outline btn-sm" onclick="handleLogout()">
                    <svg class="icon"><use href="#i-logout"/></svg>退出登录
                </button>
            </div>
        </aside>

        <!-- ===== 主内容 ===== -->
        <main class="main">
            <div class="page-header">
                <h1><svg class="icon"><use href="#i-chart"/></svg>数据看板</h1>
                <a class="link" href="/" style="font-size:14px;">返回表格编辑</a>
            </div>

            <div id="dashboardContent">
                <!-- 由 dashboard.js 动态渲染 -->
                <div class="empty-state">
                    <div class="empty-icon"><svg class="icon"><use href="#i-inbox"/></svg></div>
                    <p>请先在表格页面上传 Excel 数据</p>
                    <p class="empty-sub">上传后刷新此页面即可看到看板</p>
                </div>
            </div>
        </main>
    </div>

    <!-- 主题切换 -->
    <script>
        (function () {
            var btn = document.getElementById('themeToggle');
            function refresh() {
                var dark = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.querySelector('use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
                btn.querySelector('.theme-label').textContent = dark ? '浅色模式' : '深色模式';
            }
            btn.addEventListener('click', function () {
                var el = document.documentElement;
                var dark = el.getAttribute('data-theme') === 'dark';
                if (dark) { el.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
                else { el.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
                refresh();
            });
            refresh();
        })();
        function handleLogout() {
            if (!confirm('确定要退出登录吗？')) return;
            localStorage.removeItem('token');
            localStorage.removeItem('username');
            window.location.href = '/login.html';
        }
        // 侧边栏显示用户名
        (function () {
            var u = localStorage.getItem('username');
            var el = document.getElementById('userInfo');
            if (el && u) el.textContent = u;
        })();
    </script>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
