<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel 在线编辑工具</title>
    <script>
        // 尽早应用主题，避免闪烁
        (function () {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ===== SVG 图标库（内联 sprite） ===== -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></symbol>
        <symbol id="i-save" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
        <symbol id="i-chart" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></symbol>
        <symbol id="i-filter" viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></symbol>
        <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
        <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
        <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
        <symbol id="i-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
        <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></symbol>
        <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
    </svg>

    <div class="app-shell">
        <!-- ===== 侧边栏 ===== -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><svg class="icon"><use href="#i-table"/></svg></div>
                <span class="brand-name">ExcelToWeb</span>
            </div>

            <nav class="sidebar-nav">
                <a class="nav-link active" href="/"><svg class="icon"><use href="#i-table"/></svg>表格编辑</a>
                <a class="nav-link" href="/dashboard.html"><svg class="icon"><use href="#i-chart"/></svg>数据看板</a>
            </nav>

            <div class="sidebar-bottom">
                <button class="btn btn-outline btn-sm" id="themeToggle">
                    <svg class="icon"><use href="#i-moon"/></svg><span class="theme-label">深色模式</span>
                </button>
                <div class="user-box">
                    <svg class="icon icon-sm"><use href="#i-user"/></svg>
                    <span id="userInfo"></span>
                </div>
                <button class="btn btn-outline btn-sm" onclick="handleLogout()">
                    <svg class="icon"><use href="#i-logout"/></svg>退出登录
                </button>
            </div>
        </aside>

        <!-- ===== 主内容 ===== -->
        <main class="main">
            <div class="page-header">
                <h1><svg class="icon"><use href="#i-table"/></svg>数据表格</h1>
                <span class="status-pill" id="statusText">就绪</span>
            </div>

            <!-- ===== 工具栏 ===== -->
            <div class="toolbar">
                <!-- 文件组 -->
                <div class="toolbar-group">
                    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">
                    <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
                        <svg class="icon"><use href="#i-upload"/></svg>上传 Excel
                    </button>
                    <select id="tableSelector" class="table-select" onchange="switchTable()">
                        <option value="">-- 请选择表格 --</option>
                    </select>
                    <button class="btn btn-danger" onclick="deleteCurrentTable()" title="删除当前表格">
                        <svg class="icon"><use href="#i-trash"/></svg>删除表格
                    </button>
                </div>

                <div class="toolbar-divider"></div>

                <!-- 编辑组 -->
                <div class="toolbar-group">
                    <button class="btn" onclick="addRow()"><svg class="icon"><use href="#i-plus"/></svg>新增行</button>
                    <button class="btn" onclick="batchEdit()"><svg class="icon"><use href="#i-edit"/></svg>批量编辑</button>
                    <button class="btn btn-danger" onclick="deleteSelectedRows()"><svg class="icon"><use href="#i-trash"/></svg>删除选中</button>
                </div>

                <div class="toolbar-divider"></div>

                <!-- 数据组 -->
                <div class="toolbar-group">
                    <button class="btn btn-success" onclick="saveData()"><svg class="icon"><use href="#i-save"/></svg>保存</button>
                    <div class="dropdown">
                        <button class="btn btn-purple"><svg class="icon"><use href="#i-download"/></svg>导出<svg class="icon icon-sm"><use href="#i-chevron-down"/></svg></button>
                        <div class="dropdown-menu">
                            <button class="dropdown-item" onclick="exportExcel()"><svg class="icon icon-sm"><use href="#i-file"/></svg>导出 Excel</button>
                            <button class="dropdown-item" onclick="exportCsv()"><svg class="icon icon-sm"><use href="#i-file"/></svg>导出 CSV</button>
                            <button class="dropdown-item" onclick="downloadTemplate()"><svg class="icon icon-sm"><use href="#i-download"/></svg>下载导入模板</button>
                        </div>
                    </div>
                    <button class="btn" onclick="refreshData()"><svg class="icon"><use href="#i-refresh"/></svg>刷新</button>
                </div>

                <div class="toolbar-divider"></div>

                <!-- 设置组 -->
                <div class="dropdown">
                    <button class="btn btn-outline"><svg class="icon"><use href="#i-settings"/></svg>设置<svg class="icon icon-sm"><use href="#i-chevron-down"/></svg></button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" onclick="openRuleModal()"><svg class="icon icon-sm"><use href="#i-settings"/></svg>条件格式规则</button>
                        <button class="dropdown-item" onclick="openValidationModal()"><svg class="icon icon-sm"><use href="#i-check"/></svg>数据校验规则</button>
                        <button class="dropdown-item" onclick="clearAll()"><svg class="icon icon-sm"><use href="#i-x-circle"/></svg>清空当前数据</button>
                    </div>
                </div>

                <div class="toolbar-spacer"></div>

                <!-- 筛选组 -->
                <div class="filter-group">
                    <input type="date" id="filterDate">
                    <button class="btn btn-primary btn-sm" onclick="applyDateFilter()"><svg class="icon icon-sm"><use href="#i-filter"/></svg>筛选</button>
                    <button class="btn btn-outline btn-sm" onclick="clearDateFilter()">全部</button>
                </div>
            </div>

            <!-- ===== 表格容器 ===== -->
            <div id="tableContainer">
                <div class="empty-state">
                    <div class="empty-icon"><svg class="icon"><use href="#i-inbox"/></svg></div>
                    <p>请点击"上传 Excel"开始</p>
                    <p class="empty-sub">支持 .xlsx 和 .xls 格式</p>
                </div>
            </div>
        </main>
    </div>

    <!-- ===== 条件格式规则弹窗 ===== -->
    <div id="ruleModal" class="modal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeRuleModal()"><svg class="icon"><use href="#i-x"/></svg></button>
            <h3 class="modal-title">条件格式规则设置</h3>
            <p class="modal-sub">设置数值列的颜色规则，输入范围后点击保存。留空最大值表示"以上"。</p>

            <div class="field">
                <label class="field-label">应用列：</label>
                <select id="ruleColumnSelect" class="select" style="width:auto; min-width:160px;">
                    <option value="数量">数量</option>
                    <option value="单价(元)">单价(元)</option>
                </select>
            </div>

            <div id="ruleList">
                <!-- 规则列表由 JS 动态生成 -->
            </div>

            <button class="btn btn-primary btn-sm" onclick="addRuleRow()" style="margin-top:12px;">
                <svg class="icon icon-sm"><use href="#i-plus"/></svg>添加规则
            </button>

            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeRuleModal()">取消</button>
                <button class="btn btn-success" onclick="saveRules()"><svg class="icon"><use href="#i-save"/></svg>保存规则</button>
            </div>
        </div>
    </div>

    <!-- ===== 列筛选弹窗 ===== -->
    <div id="filterModal" class="modal">
        <div class="modal-card modal-sm">
            <button class="modal-close" onclick="closeFilter()"><svg class="icon"><use href="#i-x"/></svg></button>
            <h3 class="modal-title" style="font-size:17px;">筛选: <span id="filterColumnName"></span></h3>
            <p class="modal-sub">按条件筛选当前列的数据</p>

            <div class="field">
                <label class="field-label">条件</label>
                <select id="filterCondition" class="select">
                    <option value="contains">包含</option>
                    <option value="notContains">不包含</option>
                    <option value="equals">等于</option>
                    <option value="startsWith">开头是</option>
                    <option value="endsWith">结尾是</option>
                </select>
            </div>

            <div class="field">
                <label class="field-label">关键词</label>
                <input type="text" id="filterKeyword" class="input" placeholder="输入筛选关键词...">
            </div>

            <div class="modal-footer" style="border-top:none; padding-top:0;">
                <button class="btn btn-outline" onclick="clearFilter()">清除</button>
                <button class="btn btn-outline" onclick="closeFilter()">取消</button>
                <button class="btn btn-primary" onclick="applyFilter()">应用</button>
            </div>
        </div>
    </div>

    <!-- ===== 批量编辑弹窗 ===== -->
    <div id="batchModal" class="modal">
        <div class="modal-card modal-sm">
            <button class="modal-close" onclick="closeBatchModal()"><svg class="icon"><use href="#i-x"/></svg></button>
            <h3 class="modal-title">批量编辑</h3>
            <p class="modal-sub">将选中行的某一列统一修改为新值</p>

            <div class="field">
                <label class="field-label">选择列</label>
                <select id="batchColumnSelect" class="select"></select>
            </div>

            <div class="field">
                <label class="field-label">新值</label>
                <input type="text" id="batchValueInput" class="input" placeholder="输入要修改的值">
            </div>

            <div class="modal-footer" style="border-top:none; padding-top:0;">
                <button class="btn btn-outline" onclick="closeBatchModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmBatchEdit()">确认修改</button>
            </div>
        </div>
    </div>

    <!-- ===== 数据校验规则弹窗 ===== -->
    <div id="validationModal" class="modal">
        <div class="modal-card modal-wide">
            <button class="modal-close" onclick="closeValidationModal()"><svg class="icon"><use href="#i-x"/></svg></button>
            <h3 class="modal-title">数据校验规则设置</h3>
            <p class="modal-sub">为每列设置校验规则，点击"保存"时自动检查数据合法性</p>

            <div id="validationRuleList">
                <!-- 规则列表由 JS 动态生成 -->
            </div>

            <button class="btn btn-primary btn-sm" onclick="addValidationRule()" style="margin-top:14px;">
                <svg class="icon icon-sm"><use href="#i-plus"/></svg>添加规则
            </button>

            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closeValidationModal()">取消</button>
                <button class="btn btn-success" onclick="saveValidationRules()"><svg class="icon"><use href="#i-save"/></svg>保存规则</button>
            </div>
        </div>
    </div>

    <!-- 主题切换 -->
    <script>
        (function () {
            var btn = document.getElementById('themeToggle');
            function refresh() {
                var dark = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.querySelector('use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
                btn.querySelector('.theme-label').textContent = dark ? '浅色模式' : '深色模式';
            }
            btn.addEventListener('click', function () {
                var el = document.documentElement;
                var dark = el.getAttribute('data-theme') === 'dark';
                if (dark) { el.removeAttribute('data-theme'); localStorage.setItem('theme', 'light'); }
                else { el.setAttribute('data-theme', 'dark'); localStorage.setItem('theme', 'dark'); }
                refresh();
            });
            refresh();
        })();
    </script>

    <!-- ===== 加载 JS 模块（按依赖顺序） ===== -->
    <script src="js/api.js"></script>
    <script src="js/state.js"></script>
    <script src="js/render.js"></script>
    <script src="js/edit.js"></script>
    <script src="js/filter.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
